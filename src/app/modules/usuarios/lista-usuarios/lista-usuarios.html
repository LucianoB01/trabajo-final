<div class="usuarios-container">
    <div class="header">
        <h1>Gestión de Usuarios</h1>
        <button class="btn-primary" (click)="irCrearUsuario()">+ Crear</button>
    </div>

    @if(usuariosLista.length > 0){
        <div class="usuarios-grid">
            @for(usuario of usuariosLista; track usuario.id){
                <div class="usuario-card">
                    <h2>{{usuario.nombre}}</h2>
                    <div class="usuario-details">
                        <span><strong>Rol:</strong> {{ usuario.rol }}</span>
                        <span><strong>Email:</strong> {{ usuario.email }}</span>
                        <span><strong>Estado:</strong> {{ usuario.estado }}</span>
                    </div>
                    <div class="usuario-actions">
                        <button class="btn-primary" (click)="verDetalleUsuario(usuario.id)">
                            Detalle
                        </button>
                        <button class="btn-warning" (click)="cambiarEstadoUsuario(usuario.id)">
                            Cambiar estado
                        </button>
                        <button class="btn-danger" (click)="eliminarUsuario(usuario.id)">
                            Eliminar
                        </button>
                    </div>
                </div>
            }
        </div>
    } @else {
        <div class="empty-state">
            <p>No hay usuarios registrados en el sistema.</p>
        </div>
    }
</div>
