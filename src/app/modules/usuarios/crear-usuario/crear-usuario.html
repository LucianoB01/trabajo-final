<section class="crear-section">
    <h1>Crear usuario</h1>
    <form class="form" [formGroup]="crearForm" (ngSubmit)="submitCrearForm()">
        @if(getCrearFormError() && errores.length > 0){
            <ul class="error-list">
                <li class="error-item" *ngFor="let error of errores">{{ error }}</li>
            </ul> 
        }
        @if(formularioEnviado){
            <span class="success-item">Formulario enviado con éxito!</span>
        }
        <div class="form-group">
            <label for="name">Nombre:</label>
            <input 
                type="text" 
                formControlName="name"
                id="name" 
                name="name" 
                required
                class="input-field"
                [ngClass]="{
                    'invalid-input': 
                    crearForm.get('name')?.invalid 
                    && crearForm.get('name')?.touched
                }"
            >
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input 
                type="email" 
                formControlName="email"
                id="email" 
                name="email" 
                required
                class="input-field"
                [ngClass]="{
                    'invalid-input': 
                    crearForm.get('email')?.invalid 
                    && crearForm.get('email')?.touched
                }"
            >
        </div>

        <div class="form-group">
            <label for="rol">Rol:</label>
            <select 
                formControlName="rol"
                id="rol" 
                name="rol"
                class="input-field"
            >
                <option value="">Seleccione un rol</option>
                <option value="admin">Admin</option>
                <option value="user">User</option>
            </select>
        </div>

        <div class="form-group">
            <label for="estado">Estado:</label>
            <select 
                formControlName="estado"
                id="estado" 
                name="estado"
                class="input-field"
            >
                <option value="">Seleccione un estado</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>
        
        <div class="form-group">
            <button 
                type="submit" 
                class="submit-button"
                [ngClass]="{
                    'submit-button': crearForm.valid, 
                    'disabled-button': !crearForm.valid
                }"
                [disabled]="!crearForm.valid"
            >
                Confirmar
            </button>
        </div>
    </form>
</section>
